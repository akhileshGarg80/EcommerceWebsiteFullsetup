name: Vertax Online Sync

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Notify Vertax Backend
        run: |
          curl -X POST "${{ vars.BACKEND_URL }}/api/github/sync" \
            -H "Content-Type: application/json" \
            -H "X-Vertax-Public-Key: ${{ vars.VERTAX_PUBLIC_KEY }}" \
            -H "X-Vertax-Private-Key: ${{ secrets.VERTAX_PRIVATE_KEY }}"
